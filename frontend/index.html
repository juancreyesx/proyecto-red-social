<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniRed</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>MiniRed</h1>
    <nav>
      <button id="nav-home" class="nav-boton activo">Home</button>
      <button id="nav-amigos" class="nav-boton">Amigos</button>
    </nav>
    <button id="btn-notif" class="notif-boton">Notificaciones (0)</button>
  </header>

  <main>
    <div id="aviso" class="aviso" role="alert" hidden></div>
    <section id="panel-notif" class="panel-notif" hidden></section>

    <div id="vista-home">
      <section class="nueva">
        <textarea id="texto" maxlength="280" placeholder="¿Qué estás pensando?"></textarea>
        <div class="barra">
          <span id="contador">0 / 280</span>
          <button id="btn-publicar">Publicar</button>
        </div>
      </section>

      <section id="feed"></section>
    </div>

    <div id="vista-amigos" hidden></div>
  </main>

  <script src="js/estructuras/lista-publicaciones.js"></script>
  <script src="js/estructuras/arbol-comentarios.js"></script>
  <script src="js/estructuras/cola-notificaciones.js"></script>
  <script src="js/estructuras/grafo-amigos.js"></script>
  <script src="js/estructuras/bst-usuarios.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/amigos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
