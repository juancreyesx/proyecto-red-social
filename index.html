<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniRed</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>MiniRed</h1>
    <p>Home</p>
  </header>

  <main>
    <section class="nueva">
      <textarea id="texto" maxlength="280" placeholder="¿Qué estás pensando?"></textarea>
      <div class="barra">
        <span id="contador">0 / 280</span>
        <button id="btn-publicar">Publicar</button>
      </div>
    </section>

    <section id="feed"></section>
  </main>

  <script src="js/estructuras/lista-publicaciones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
